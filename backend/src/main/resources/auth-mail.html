<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Подтверждение доступа · qwork</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#142034;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:28px}
    .brand{font-size:26px;font-weight:750;color:#087cff;margin-bottom:30px}h1{font-size:25px;line-height:1.25;margin:0 0 12px}p{color:#667890;line-height:1.5}
    label{display:block;margin-top:18px;font-size:14px;font-weight:600}input{width:100%;border:1px solid #dce5f1;border-radius:11px;padding:14px;margin-top:8px;font:inherit}
    button{width:100%;padding:15px;border:0;border-radius:11px;background:#087cff;color:white;font:600 16px inherit;margin-top:24px;cursor:pointer}
    button:disabled{opacity:.55;cursor:default}.error{color:#b83d4e}.success{color:#16825a}[hidden]{display:none!important}
  </style>
  <script src="/auth-mail.js" defer></script>
</head>
<body>
  <main>
    <div class="brand">qwork</div>
    <h1 id="title">Подтверждение доступа</h1>
    <p id="description">Проверьте адрес страницы перед продолжением.</p>
    <form id="form">
      <div id="passwordFields" hidden>
        <label>Новый пароль<input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password"></label>
        <label>Повторите пароль<input id="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password"></label>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
      <button id="submit" type="submit">Продолжить</button>
    </form>
    <p id="success" class="success" role="status" hidden></p>
  </main>
</body>
</html>
